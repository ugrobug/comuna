global
    log stdout format raw local0 warning
    maxconn 128
    nbthread 1

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 70s
    timeout server 70s
    timeout queue 5s

resolvers telegram_dns
    nameserver cloudflare 1.1.1.1:53
    nameserver google 8.8.8.8:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 60s

frontend telegram_tls
    bind :443
    default_backend telegram_api

backend telegram_api
    server api api.telegram.org:443 check inter 30s fall 3 rise 2 resolvers telegram_dns resolve-prefer ipv4 init-addr none maxconn 64

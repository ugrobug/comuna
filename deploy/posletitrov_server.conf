# WordPress retirement: public pages are served entirely by nginx.
include /etc/nginx/posletitrov_redirects_generated.conf;

# Preserve encoded filenames and their case; never forward tracking/query data.
# Imported WordPress uploads already live under this prefix in our media store.
map $request_uri $posletitrov_media_redirect {
  default "";
  "~*^/wp-content/uploads/(?<posletitrov_upload>[^?]+)(?:\?.*)?$" "https://media.tambur.pub/legacy-wp/uploads/$posletitrov_upload";
}

server {
  listen 80;
  listen [::]:80;
  server_name posletitrov.ru www.posletitrov.ru;

  # TLS is terminated by Jino. Keep HTTP-01 reachable without a redirect.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/static;
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "no-store";
    limit_except GET {
      deny all;
    }
  }

  # Crawlers must be able to see the 301/410 responses after the move.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location = /sitemap.xml {
    return 301 https://tambur.pub/sitemap.xml;
  }
  location = /sitemap_index.xml {
    return 301 https://tambur.pub/sitemap.xml;
  }
  location = /wp-sitemap.xml {
    return 301 https://tambur.pub/sitemap.xml;
  }

  location / {
    if ($posletitrov_redirect != "") {
      return 301 $posletitrov_redirect;
    }
    if ($posletitrov_media_redirect != "") {
      return 301 $posletitrov_media_redirect;
    }
    # Removed URLs without an equivalent must not become soft-404 homepage redirects.
    default_type text/html;
    charset utf-8;
    return 410 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Страница удалена</title><h1>Этой страницы больше нет</h1><p>«После титров» переехал на Тамбур. Читайте материалы <a href="https://tambur.pub/comuns/after_the_credits">в нашем сообществе</a>.</p></html>';
  }
}
